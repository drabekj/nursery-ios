# The Xcode project. Make it with: xcodegen generate
# The .xcodeproj is not in git. This file is the source.
name: Nursery
options:
  bundleIdPrefix: cz.drabek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here, or in Xcode under Signing & Capabilities (both targets).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Nursery:
    type: application
    platform: iOS
    sources:
      - path: Nursery
      - path: Shared
    info:
      path: Nursery/Info.plist
      properties:
        CFBundleDisplayName: Nursery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The sound continues on the lock screen. Picture in picture also needs this mode.
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Nursery connects to the baby monitor server on your home network.
        # The server is a LAN address on plain HTTP and RTSP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.drabek.nursery
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: NurseryWidget

  NurseryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NurseryWidget
      - path: Shared
    info:
      path: NurseryWidget/Info.plist
      properties:
        CFBundleDisplayName: Nursery
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.drabek.nursery.widget
        SKIP_INSTALL: YES
