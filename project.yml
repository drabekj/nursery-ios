# The Xcode project. Make it with: xcodegen generate
# The .xcodeproj is not in git. This file is the source.
name: Nursery
options:
  bundleIdPrefix: cz.drabek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: cs

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here, or in Xcode under Signing & Capabilities (both targets).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Nursery:
    type: application
    platform: iOS
    sources:
      - path: Nursery
      - path: Shared
    info:
      path: Nursery/Info.plist
      properties:
        CFBundleDisplayName: Chůvička
        # Czech is the only language of the app, so it is Czech also on an English phone.
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The sound continues on the lock screen. Picture in picture also needs this mode.
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        # chuvicka://pair?…: the QR code of the phone at the baby opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: cz.drabek.nursery.pair
            CFBundleURLSchemes: [chuvicka]
        NSLocalNetworkUsageDescription: Chůvička se připojuje ke kameře nebo k druhému iPhonu přes vaši domácí síť. Obraz ani zvuk neopustí váš domov.
        # The two phones find each other with Bonjour.
        NSBonjourServices:
          - _chuvicka._tcp
        NSCameraUsageDescription: Fotoaparát naskenuje QR kód z telefonu u miminka. Jako telefon u miminka z něj Chůvička posílá obraz do telefonů rodičů, nikdy přes cizí server.
        NSMicrophoneUsageDescription: Jako iPhone u miminka vysílá Chůvička zvuk z pokojíčku do telefonů rodičů. Jen ve vaší domácí síti.
        # The server is a LAN address on plain HTTP and RTSP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.drabek.nursery
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: NurseryWidget
    # The Nursery scheme also runs the unit tests: xcodebuild test -scheme Nursery
    scheme:
      testTargets: [NurseryTests]

  NurseryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: NurseryWidget
      - path: Shared
    info:
      path: NurseryWidget/Info.plist
      properties:
        CFBundleDisplayName: Chůvička
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.drabek.nursery.widget
        SKIP_INSTALL: YES

  # The unit tests of the pure code: SDP, RTP, H.264, G.711, the Digest login, the pairing link.
  # They run in the app on the simulator, through the Nursery scheme.
  NurseryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NurseryTests]
    dependencies:
      - target: Nursery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.drabek.nursery.tests
        GENERATE_INFOPLIST_FILE: YES
