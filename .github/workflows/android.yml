name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # The rolling release "android-latest" with the APK.

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: |
          # The pure parts: SDP, RTP, H.264, G.711, the camera login, and the pairing link.
          cd android
          gradle testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee ../test.log | grep -E "^e: |error:|FAILED|BUILD|tests completed" || true
          grep -q "BUILD SUCCESSFUL" ../test.log

      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.CHUVICKA_KEYSTORE_B64 }}
          CHUVICKA_KEYSTORE_PASSWORD: ${{ secrets.CHUVICKA_KEYSTORE_PASSWORD }}
        run: |
          # The same key for each build, so a new APK installs over the old one.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chuvicka.p12"
            export CHUVICKA_KEYSTORE="$RUNNER_TEMP/chuvicka.p12"
          fi
          cd android
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log | grep -E "^e: |error:|warning:|BUILD" || true
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../app.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots of the demo mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: bash android/tools/shots.sh

      - name: Upload the APK, the screenshots, and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-output
          path: |
            app.apk
            shots/
            gradle.log
            test.log
            android/app/build/test-results/**/*.xml

      - name: Publish the APK for the phones
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app.apk chuvicka.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest chuvicka.apk --title "Chůvička pro Android" \
            --notes "Nejnovější verze. Na telefonu otevřete odkaz na chuvicka.apk a nainstalujte ji." --target "$GITHUB_SHA"
