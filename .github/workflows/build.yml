name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Nursery.xcodeproj -scheme Nursery \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E 'error:|warning:|BUILD (SUCCEEDED|FAILED)' | grep -v 'appintentsmetadataprocessor' || true
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
