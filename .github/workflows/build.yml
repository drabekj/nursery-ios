name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate the project
        run: brew install xcodegen && xcodegen generate

      - name: Build for a device (no signing)
        run: |
          set -o pipefail
          xcodebuild build -project Nursery.xcodeproj -scheme Nursery \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee device.log \
            | grep -E ' (error|warning): |BUILD (SUCCEEDED|FAILED)' | sort -u || true
          grep -q 'BUILD SUCCEEDED' device.log

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project Nursery.xcodeproj -scheme Nursery \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee sim.log | grep -E ' error: |BUILD (SUCCEEDED|FAILED)' | sort -u || true
          grep -q 'BUILD SUCCEEDED' sim.log

      - name: Screenshots of the demo mode
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          print(sorted(c,key=lambda x:x["name"])[-1]["udid"])')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 21:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100 || true
          APP=$(find build/sim -name 'Nursery.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() {  # shot <file> <screen> <appearance>
            xcrun simctl terminate "$UDID" cz.drabek.nursery || true
            xcrun simctl launch "$UDID" cz.drabek.nursery -demo YES -demoScreen "$2" -appearance "$3" -AppleLanguages "(cs)" -AppleLocale cs_CZ
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          for s in main sound alerts aim activity settings night help; do shot "$s" "$s" light; done
          # The app's own log, to see what the aim screenshot did.
          DATA=$(xcrun simctl get_app_container "$UDID" cz.drabek.nursery data)
          cp "$DATA/Library/Application Support/events.log" shots/events.log || true
          shot main-dark main dark
          shot sound-dark sound dark
          shot activity-dark activity dark

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            shots/
            device.log
            sim.log
